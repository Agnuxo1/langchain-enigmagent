[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-enigmagent"
version = "0.1.0"
description = "LangChain integration for EnigmAgent — resolve {{PLACEHOLDER}} secrets at the LLM boundary so models never see real API keys"
authors = [{name="Francisco Angulo de Lafuente", email="agnuxo1@gmail.com"}]
license = {text="MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["langchain","enigmagent","mcp","secrets","vault","credentials","security","agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "langchain-core>=0.3.0",
  "httpx>=0.24",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Agnuxo1/langchain-enigmagent"
"Bug Tracker" = "https://github.com/Agnuxo1/langchain-enigmagent/issues"
"Main Project" = "https://github.com/Agnuxo1/EnigmAgent"

[tool.hatch.build.targets.wheel]
packages = ["langchain_enigmagent"]
